# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: connect this repo in the Render dashboard and import this file.
# Required secrets (set in Render Environment → Secret Files or env group):
#   GEMINI_LLM_API_KEY, GEMINI_EMBEDDING_API_KEY, ADMIN_PASSWORD (and optionally APPROVER_*)

services:
  - type: web
    name: bosun
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render's free tier; upgrade to "standard" for always-on + more RAM.
    plan: free
    region: singapore

    # Render persistent disk: SQLite lives here across deploys.
    disk:
      name: bosun-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      # ---- Database (SQLite on the persistent disk) ----
      - key: DB_PROVIDER
        value: sqlite
      - key: DB_CONNECTION
        value: "Data Source=/app/data/db/bosun.db"

      # ---- LLM + embeddings (supply real values in Render dashboard) ----
      - key: GEMINI_LLM_API_KEY
        sync: false          # Render prompts for the value; never stored in git
      - key: GEMINI_EMBEDDING_API_KEY
        sync: false

      # ---- Optional model overrides (defaults work without these) ----
      # - key: LLM_MODEL
      #   value: gemini-2.5-flash
      # - key: EMBEDDING_MODEL
      #   value: gemini-embedding-2

      # ---- Auth ----
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # set a strong password in the Render dashboard

      # ---- Ports (Render routes 443 → 8080 inside the container) ----
      - key: BACKEND_PORT
        value: "8080"

      # ---- Live monitoring sockets (Modbus + NMEA, disabled on free tier) ----
      - key: SIM_MODBUS_PORT
        value: "5483"
      - key: SIM_NMEA_PORT
        value: "5484"
